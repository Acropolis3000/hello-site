<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi, I'm Selah</title>
  <style>
    :root { --bg: #fdfbf7; --fg: #1f1d1a; --accent: #c2410c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171512; --fg: #f3efe8; --accent: #fb923c; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 4rem); line-height: 1.15; margin: 0; }
    span { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Hi, I'm Selah and my website is <span>live</span>.</h1>
</body>
</html>
